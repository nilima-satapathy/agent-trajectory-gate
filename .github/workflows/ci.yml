name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit + integration tests (offline)
        run: pytest tests/ -q -m "not live"

      - name: Fixture quick suite gate
        run: python evals/run_suite.py --suite quick --mode fixture --no-fail

      # Live Groq tests are local-only (need OPENAI_API_KEY secrets intentionally not required).
